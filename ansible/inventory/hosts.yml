---
# This inventory works over SSH --> UNO Q
all:
  vars:
    ansible_user: arduino
    ansible_port: 22
    ansible_python_interpreter: auto_silent
    ansible_password: "{{ vault_uno_q_password }}"

  children:
    uno_q:
      hosts:
        uno-q-hack-coms1:
          ansible_host: 192.168.10.106


    # Only these boards get Home Assistant in Docker.
    homeassistant:
      hosts:
        uno-q-hack-coms1:
    ha-host:
      hosts:
        uno-q-hack-coms1: